<style>

html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font:400 16px/1.6 Inter,system-ui,sans-serif;overflow-x:hidden}
#rays{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}

header{position:fixed;top:0;left:0;right:0;z-index:10;background:rgba(5,8,15,.6);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav{max-width:1100px;margin:0 auto;padding:.8rem 20px;display:flex;justify-content:space-between;align-items:center;gap:1rem}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.3rem;color:var(--text);text-decoration:none}

.box{width:132px;height:132px;border-radius:26px;display:grid;place-items:center;background:rgba(5,8,15,.92);border:1px solid var(--glow);box-shadow:0 0 50px rgba(57,255,20,.25),inset 0 0 30px rgba(57,255,20,.08);margin-bottom:56px}
.box img{width:84px;height:84px;border-radius:18px}
h1{font-size:clamp(2.6rem,8vw,5.2rem);font-weight:900;line-height:1.02;letter-spacing:-.045em;text-shadow:0 0 40px var(--bg),0 0 12px var(--bg)}
.grad{background:linear-gradient(120deg,var(--g),var(--c));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{max-width:620px;margin:1.4rem auto 2.4rem;color:#b3c0d4;font-size:clamp(1rem,2vw,1.2rem);text-shadow:0 0 12px var(--bg)}
.btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{display:inline-flex;align-items:center;gap:10px;padding:15px 30px;border-radius:12px;font:700 1rem Inter,sans-serif;text-decoration:none;transition:.25s}
.btn.p{background:var(--g);color:#000;box-shadow:0 6px 30px rgba(57,255,20,.4)}
.btn.p:hover{transform:translateY(-2px);box-shadow:0 10px 40px rgba(57,255,20,.6)}

.btn.s:hover{border-color:var(--glow);transform:translateY(-2px)}
.tag{margin-top:2.2rem;font:400 .75rem 'JetBrains Mono',monospace;color:var(--muted);letter-spacing:.08em}
.tag b{color:var(--g);font-weight:700}
section.f{padding:90px 20px 110px;max-width:1100px;margin:0 auto}
h2{text-align:center;font-size:clamp(1.8rem,4vw,2.7rem);font-weight:900;letter-spacing:-.03em;margin-bottom:3rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.2rem}
.card{position:relative;overflow:hidden;padding:2rem;border-radius:18px;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(16px);transition:.35s}
.card::after{content:"";position:absolute;top:-60px;right:-60px;width:140px;height:140px;background:conic-gradient(from 200deg,transparent,rgba(57,255,20,.35),transparent 40%);filter:blur(18px);opacity:.5;transition:opacity .35s}
.card:hover{transform:translateY(-5px);border-color:var(--glow)}
.card:hover::after{opacity:1}
.n{font:700 .8rem 'JetBrains Mono',monospace;color:var(--g);margin-bottom:1rem}
.card h3{font-size:1.2rem;font-weight:800;margin-bottom:.6rem}
.card p{color:var(--muted);font-size:.95rem}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:800px;margin:0 auto}.chip{padding:9px 18px;border:1px solid var(--line);border-radius:100px;background:var(--card);font:400 .85rem 'JetBrains Mono',monospace;color:#cfe;transition:.25s}.chip:hover{border-color:var(--glow);color:var(--g)}.chip.hl{border-color:var(--glow);color:var(--g)}.stk{text-align:center}.stk p{color:var(--muted);margin:-1.8rem 0 2rem}.disc{max-width:640px;margin:.9rem auto 0;font-size:.78rem;opacity:.75}
footer{position:relative;z-index:1;padding:32px 20px;text-align:center;border-top:1px solid var(--line);color:var(--muted);font-size:.85rem;background:rgba(5,8,15,.7)}
footer a{color:var(--muted);text-decoration:none;margin:0 10px}
footer a:hover{color:var(--g)}
@media(max-width:700px){.links{display:none}.box{width:110px;height:110px;margin-bottom:44px}.box img{width:70px;height:70px}.btns{flex-direction:column;width:100%;max-width:320px}.btn{justify-content:center}}
</style>
</head>
<body>

<script>
const D={
ru:{nav1:'Возможности',nav2:'Генератор',nav3:'Приватность',nav4:'Стек',h1a:'Твой VPN.',h1b:'Твой свет.',
sub:'Android-клиент на ядре sing-box. Вставьте подписку, нажмите кнопку и подключайтесь к своим серверам. Оформление приходит с сервера.',
dl:'Скачать на GitHub',gen:'Генератор',why:'Один луч — одна задача',
f1t:'Протоколы и транспорты',f1p:'VLESS, VMess, Trojan, Shadowsocks, Hysteria2, TUIC, AnyTLS, SOCKS5, HTTP. Транспорты: WebSocket, gRPC, HTTPUpgrade, XHTTP.',
f2t:'Оформление с сервера',f2p:'Название, логотип, имена и иконки узлов приходят в подписке. Пересобирать APK не нужно.',
f3t:'Подписка под контролем',f3p:'Остаток трафика и срока из subscription-userinfo, автообновление раз в 6, 12 или 24 часа, импорт по QR.',
f4t:'Раздельное проксирование',f4p:'Выбирайте приложения, которые идут через клиент, и назначайте каждому свой узел.',
f5t:'DNS и правила',f5p:'Отдельные DNS для proxy и direct, блокировка рекламы, прямой доступ к локальной сети, обновляемые наборы правил.',
f6t:'Всё на виду',f6p:'Активные соединения, журнал, диагностика ядра. IP-адреса в интерфейсе можно маскировать.',
stk:'Под капотом',stkp:'Нативное Android-приложение без обёрток.',
disc:'RayBox — только клиент. Серверы и подписки не предоставляются. Вы отвечаете за соблюдение законов своей страны.'},
en:{nav1:'Features',nav2:'Generator',nav3:'Privacy',nav4:'Stack',h1a:'Your VPN.',h1b:'Your light.',
sub:'Android client built on the sing-box core. Paste a subscription, tap connect and use your own servers. The look comes from the server.',
dl:'Get on GitHub',gen:'Generator',why:'One ray, one job',
f1t:'Protocols & transports',f1p:'VLESS, VMess, Trojan, Shadowsocks, Hysteria2, TUIC, AnyTLS, SOCKS5, HTTP. Transports: WebSocket, gRPC, HTTPUpgrade, XHTTP.',
f2t:'Server-side branding',f2p:'Title, logo, node names and icons arrive with the subscription. No APK rebuild needed.',
f3t:'Subscription control',f3p:'Remaining traffic and days from subscription-userinfo, auto-update every 6, 12 or 24 hours, QR import.',
f4t:'Per-app routing',f4p:'Pick which apps go through the client and assign each one its own node.',
f5t:'DNS & rules',f5p:'Separate DNS for proxy and direct, ad blocking, direct LAN access, updatable rule sets.',
f6t:'Full visibility',f6p:'Live connections, logs, core diagnostics. IP addresses can be masked in the UI.',
stk:'Under the hood',stkp:'A native Android app, no wrappers.',
disc:'RayBox is a client only. No servers or subscriptions are provided. You are responsible for complying with the laws of your country.'}};
function setLang(l){
  try{localStorage.setItem('raybox_lang',l)}catch(e){}
  document.documentElement.lang=l;
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=D[l][e.dataset.i]);
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));
}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
let saved='ru';try{saved=localStorage.getItem('raybox_lang')||'ru'}catch(e){}
setLang(D[saved]?saved:'ru');

/* Ray casting: light source + the logo box as an obstacle */
const cv=document.getElementById('rays'),cx=cv.getContext('2d'),box=document.getElementById('box');
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W,H,N,L={x:0,y:0},T={x:0,y:0},free=false,t=0;
function size(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0);N=W<700?150:260}
size();addEventListener('resize',size);
addEventListener('pointermove',e=>{free=true;T.x=e.clientX;T.y=e.clientY});
function frame(){
  t+=.006;
  const r=box.getBoundingClientRect(),bx=r.left+r.width/2,by=r.top+r.height/2;
  if(!free){T.x=bx+Math.cos(t)*Math.min(W*.4,520);T.y=by+Math.sin(t*1.3)*Math.min(H*.3,240)}
  L.x+=(T.x-L.x)*.08;L.y+=(T.y-L.y)*.08;
  cx.globalCompositeOperation='source-over';cx.clearRect(0,0,W,H);
  cx.globalCompositeOperation='lighter';
  const R=Math.hypot(W,H),inside=L.x>r.left&&L.x<r.right&&L.y>r.top&&L.y<r.bottom;
  const pa=new Path2D(),pb=new Path2D(),hits=[];
  for(let i=0;i<N;i++){
    const a=i/N*Math.PI*2+t*.4,dx=Math.cos(a),dy=Math.sin(a);let len=R;
    if(!inside){
      const x1=(r.left-L.x)/dx,x2=(r.right-L.x)/dx,y1=(r.top-L.y)/dy,y2=(r.bottom-L.y)/dy;
      const tn=Math.max(Math.min(x1,x2),Math.min(y1,y2)),tf=Math.min(Math.max(x1,x2),Math.max(y1,y2));
      if(tf>=tn&&tn>0){len=tn;hits.push(L.x+dx*tn,L.y+dy*tn)}
    }
    const p=i%2?pa:pb;p.moveTo(L.x,L.y);p.lineTo(L.x+dx*len,L.y+dy*len);
  }
  cx.lineWidth=1.2;
  cx.strokeStyle='rgba(57,255,20,.085)';cx.stroke(pa);
  cx.strokeStyle='rgba(0,229,255,.07)';cx.stroke(pb);
  cx.fillStyle='rgba(190,255,180,.55)';
  for(let i=0;i<hits.length;i+=2)cx.fillRect(hits[i]-1,hits[i+1]-1,2,2);
  const g=cx.createRadialGradient(L.x,L.y,0,L.x,L.y,170);
  g.addColorStop(0,'rgba(220,255,210,.9)');g.addColorStop(.12,'rgba(57,255,20,.35)');g.addColorStop(1,'rgba(57,255,20,0)');
  cx.fillStyle=g;cx.fillRect(L.x-170,L.y-170,340,340);
  if(!still)requestAnimationFrame(frame);
}
frame();
</script>
